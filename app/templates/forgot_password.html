<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='assets/images/logo/mycloud-logo.svg') }}">
    <title>Forgot Password | MyCloud</title>

    <style>
        /* Light theme — default */
        :root {
            color-scheme: light;

            --bg-gradient: linear-gradient(135deg, #C0D4F8 0%, #E3EFFF 45%, #E8D8EE 100%);

            --color-primary: #567fff;
            --color-primary-hover: #3D7BD4;

            --color-bg-main: #f2f2ea;
            --color-bg-surface: #FFFFFF;
            --color-bg-overlay: #e8e8de;

            --color-text-primary: #131418;
            --color-text-secondary: #2e3138;
            --color-text-muted: #474b54;

            --color-border: #e7ebef;
            --color-hover-state: #dbded7;
            --color-active: #567fff;
            --color-focus-ring: #5597EB;

            --message-success-bg: #DCFCE7;
            --message-success-text: #166534;

            --message-error-bg: #FEE2E2;
            --message-error-text: #991B1B;

            --message-info-bg: #DBEAFE;
            --message-info-text: #1E40AF;
        }

        /* Dark theme */
        [data-theme="dark"] {
            color-scheme: dark;

            --bg-gradient: linear-gradient(135deg, #6B8FD4 0%, #8BA8D9 45%, #A88BB8 100%);

            --color-primary: #2867ac;
            --color-primary-hover: #3D7BD4;

            --color-bg-main: #1b1b1b;
            --color-bg-surface: #242424;
            --color-bg-overlay: #36373b;

            --color-text-primary: #F1F5F9;
            --color-text-secondary: #CBD5E1;
            --color-text-muted: #94A3B8;

            --color-border: #343434;
            --color-hover-state: #353535;
            --color-active: #2867ac;
            --color-focus-ring: #5597EB;

            --message-success-bg: #14532D;
            --message-success-text: #BBF7D0;

            --message-error-bg: #7F1D1D;
            --message-error-text: #FECACA;

            --message-info-bg: #1E3A8A;
            --message-info-text: #BFDBFE;
        }

        @font-face {
            font-family: "Material Symbols Rounded";
            src: url("{{ url_for('static', filename='fonts/material-symbols-rounded.woff2') }}") format("woff2");
            font-weight: 100 700;
            font-style: normal;
            font-display: block;
        }

        .material-symbols-rounded {
            font-family: "Material Symbols Rounded";
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: "liga";
            -webkit-font-smoothing: antialiased;
            font-feature-settings: "liga";
        }

        @font-face {
            font-family: "Roboto";
            src: url("{{ url_for('static', filename='fonts/Roboto-VariableFont_wdth,wght.ttf') }}") format("truetype");
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            background: var(--color-bg-main);
            font-family: Arial, Helvetica, sans-serif;
            color: var(--color-text-primary);
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
        }

        .signup-section {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 90px 20px 30px;
        }

        .signup-card {
            width: min(100%, 500px);
            padding: 35px;
            background: var(--color-bg-surface);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
        }

        .signup-header {
            margin-bottom: 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .signup-header h1 {
            margin: 0 0 10px;
            font-size: 28px;
        }

        .signup-header p {
            margin: 0;
            color: var(--color-text-secondary);
            line-height: 1.6;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
            margin-bottom: 18px;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid transparent;
            background: var(--color-bg-main);
            color: var(--color-text-primary);
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--color-focus-ring);
        }

        .signin-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: var(--color-active);
            color: #FFFFFF;
            font-size: 15px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .signin-button:hover {
            opacity: 0.9;
        }

        .signin-button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .signin-link {
            margin-top: 22px;
            text-align: center;
            font-size: 14px;
            color: var(--color-text-secondary);
        }

        .signin-link a {
            margin-left: 5px;
            color: var(--color-active);
            font-weight: 600;
            text-decoration: none;
        }

        .signin-link a:hover {
            text-decoration: underline;
        }

        #form-message {
            display: none;
            padding: 12px 14px;
            margin-bottom: 18px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        #form-message.success {
            display: block;
            background: var(--message-success-bg);
            color: var(--message-success-text);
        }

        #form-message.error {
            display: block;
            background: var(--message-error-bg);
            color: var(--message-error-text);
        }

        #form-message.info {
            display: block;
            background: var(--message-info-bg);
            color: var(--message-info-text);
        }

        .theme {
            position: absolute;
            display: flex;
            align-items: center;
            gap: 10px;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: var(--color-bg-surface);
            color: var(--color-text-secondary);
            border-radius: 50px;
            border: none;
            cursor: pointer;
        }

        .theme .material-symbols-rounded {
            font-size: 19px;
        }

        .theme:hover {
            background: var(--color-hover-state);
        }

        .logo-holder {
            position: absolute;
            top: 10px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .drive-name {
            display: flex;
            align-items: end;
            gap: 3px;

            position: relative;
            top: -10px;

            user-select: none;
            font-size: 12px;
        }

        .drive-name h1,
        .drive-name p {
            margin-bottom: 0;
        }

        .drive-name p {
            color: var(--color-text-secondary);
        }
    </style>
</head>

<body>

    <div class="logo-holder">
        <img style="width: 80px; height: auto;"
            src="{{ url_for('static', filename='assets/images/logo/mycloud-logo-v1.svg') }}" alt="logo">
        <div class="drive-name" id="brand-home" title="Go to MyCloud">
            <h1>MyCloud</h1>
            <p>by ms3</p>
        </div>
    </div>

    <button class="theme" id="theme-toggle" type="button" aria-label="Switch theme">
        <span id="theme-icon" class="material-symbols-rounded">
            dark_mode
        </span>
        <span class="label" id="theme-label">Dark mode</span>
    </button>

    <section class="signup-section">
        <div class="signup-card">

            <div class="signup-header">
                <h1>Forgot password?</h1>

                <p>
                    Enter your account email address. We'll send you
                    a link to reset your password.
                </p>
            </div>

            <form id="forgot-password-form">

                <div class="form-group">
                    <label for="email">Email address</label>

                    <input type="email" id="email" name="email" autocomplete="email"
                        placeholder="Enter your account email" required>
                </div>

                <div id="form-message" role="status" aria-live="polite"></div>

                <button type="submit" class="signin-button" id="submit-forgot-password">
                    Send Reset Link →
                </button>

            </form>

            <div class="signin-link">
                <a href="/signin">← Back to Sign In</a>
            </div>

        </div>
    </section>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>

    <script>
        const form = document.querySelector("#forgot-password-form");
        const emailInput = document.querySelector("#email");
        const messageBox = document.querySelector("#form-message");
        const submitButton = document.querySelector("#submit-forgot-password");

        function showMessage(message, type) {
            messageBox.textContent = message;
            messageBox.className = type;
        }

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            messageBox.className = "";
            messageBox.textContent = "";

            submitButton.disabled = true;
            submitButton.textContent = "Sending...";

            try {
                const response = await fetch(
                    "/api/auth/forgot-password",
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        credentials: "same-origin",
                        body: JSON.stringify({
                            email: emailInput.value.trim()
                        })
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    showMessage(
                        "We couldn't process your request. Please try again.",
                        "error"
                    );
                    return;
                }

                showMessage(
                    data.message ||
                    "If an account exists with that email, a reset link will be sent.",
                    "info"
                );

            } catch (error) {
                showMessage(
                    "Unable to connect. Please try again.",
                    "error"
                );
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = "Send Reset Link →";
            }
        });
    </script>

</body>

</html>
