<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='assets/images/logo/mycloud-logo.svg') }}">
    <title>Reset Password — MyCloud</title>


    <style>
        :root {
            color-scheme: light;

            --color-primary: #567fff;
            --color-primary-hover: #3D7BD4;

            --color-bg-main: #f2f2ea;
            --color-bg-surface: #FFFFFF;

            --color-text-primary: #131418;
            --color-text-secondary: #2e3138;

            --color-border: #e7ebef;
            --color-hover-state: #dbded7;
            --color-active: #567fff;

            --message-success-bg: #DCFCE7;
            --message-success-text: #166534;

            --message-error-bg: #FEE2E2;
            --message-error-text: #991B1B;

            --message-warning-bg: #FEF3C7;
            --message-warning-text: #92400E;
        }

        [data-theme="dark"] {
            color-scheme: dark;

            --color-primary: #2867ac;
            --color-primary-hover: #3D7BD4;

            --color-bg-main: #1b1b1b;
            --color-bg-surface: #242424;

            --color-text-primary: #F1F5F9;
            --color-text-secondary: #CBD5E1;

            --color-border: #343434;
            --color-hover-state: #353535;
            --color-active: #2867ac;

            --message-success-bg: #14532D;
            --message-success-text: #BBF7D0;

            --message-error-bg: #7F1D1D;
            --message-error-text: #FECACA;

            --message-warning-bg: #78350F;
            --message-warning-text: #FDE68A;
        }

        @font-face {
            font-family: "Material Symbols Rounded";
            src: url("{{ url_for('static', filename='fonts/material-symbols-rounded.woff2') }}") format("woff2");
            font-weight: 100 700;
            font-style: normal;
            font-display: block;
        }

        .material-symbols-rounded {
            font-family: "Material Symbols Rounded";
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: "liga";
            -webkit-font-smoothing: antialiased;
            font-feature-settings: "liga";
        }

        @font-face {
            font-family: "Roboto";
            src: url("{{ url_for('static', filename='fonts/Roboto-VariableFont_wdth,wght.ttf') }}") format("truetype");
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--color-bg-main);
            color: var(--color-text-primary);
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
        }

        .reset-section {
            min-height: 100vh;
            min-height: 100dvh;
            width: 100%;
            padding: 90px 20px 30px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .reset-card {
            width: min(100%, 500px);
            padding: 35px;
            background: var(--color-bg-surface);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
        }

        .reset-header {
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .reset-header .material-symbols-rounded {
            font-size: 42px;
            color: var(--color-active);
            margin-bottom: 12px;
        }

        .reset-header h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .reset-header p {
            margin: 0;
            color: var(--color-text-secondary);
            line-height: 1.5;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
            margin-bottom: 18px;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 600;
        }

        .password-input {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-group input {
            width: 100%;
            padding: 12px 65px 12px 14px;
            border-radius: 10px;
            border: 1px solid transparent;
            background: var(--color-bg-main);
            color: var(--color-text-primary);
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: var(--color-active);
        }

        .show-password {
            position: absolute;
            right: 10px;
            padding: 6px;

            border: none;
            background: transparent;
            color: var(--color-text-secondary);
            font-size: 13px;
            cursor: pointer;
        }

        .reset-button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            background: var(--color-active);
            color: #ffffff;
            font-size: 15px;
            cursor: pointer;
        }

        .reset-button:hover {
            opacity: 0.9;
        }

        .reset-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .signin-link {
            margin-top: 22px;
            text-align: center;
            font-size: 14px;
        }

        .signin-link a {
            margin-left: 5px;
            color: var(--color-active);
            font-weight: 600;
            text-decoration: none;
        }

        .signin-link a:hover {
            text-decoration: underline;
        }

        #form-message {
            display: none;
            padding: 10px 14px;
            margin-bottom: 15px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
        }

        #form-message.success {
            display: block;
            background: var(--message-success-bg);
            color: var(--message-success-text);
        }

        #form-message.error {
            display: block;
            background: var(--message-error-bg);
            color: var(--message-error-text);
        }

        #form-message.warning {
            display: block;
            background: var(--message-warning-bg);
            color: var(--message-warning-text);
        }

        .theme {
            position: absolute;
            top: 20px;
            right: 20px;

            display: flex;
            align-items: center;
            gap: 10px;

            padding: 10px 20px;
            background: var(--color-bg-surface);
            color: var(--color-text-secondary);
            border-radius: 50px;
            border: none;
            cursor: pointer;
        }

        .theme .material-symbols-rounded {
            font-size: 19px;
        }

        .theme:hover {
            background: var(--color-hover-state);
        }

        .logo-holder {
            position: absolute;
            top: 10px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .drive-name {
            display: flex;
            align-items: end;
            gap: 3px;

            position: relative;
            top: -10px;

            user-select: none;
            font-size: 12px;
        }

        .drive-name h1,
        .drive-name p {
            margin-bottom: 0;
        }

        .drive-name p {
            color: var(--color-text-secondary);
        }

        @media (max-width: 480px) {
            .reset-card {
                padding: 25px 20px;
            }

            .theme {
                padding: 9px 12px;
            }

            .theme .label {
                display: none;
            }

            .reset-header h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="logo-holder">
        <img style="width: 80px; height: auto;"
            src="{{ url_for('static', filename='assets/images/logo/mycloud-logo-v1.svg') }}" alt="logo">
        <div class="drive-name" id="brand-home" title="Go to MyCloud">
            <h1>MyCloud</h1>
            <p>by ms3</p>
        </div>
    </div>

    <button class="theme" id="theme-toggle" type="button" aria-label="Switch to dark theme">
        <span id="theme-icon" class="material-symbols-rounded">dark_mode</span>
        <span class="label" id="theme-label">Dark mode</span>
    </button>

    <section class="reset-section">
        <div class="reset-card">

            <div class="reset-header">
                <span class="material-symbols-rounded" aria-hidden="true">
                    lock_reset
                </span>

                <h1>Reset Password</h1>
                <p>Create a new password for your MyCloud account.</p>
            </div>

            <div id="form-message" role="status" aria-live="polite"></div>

            <form id="reset-password-form">

                <div class="form-group">
                    <label for="new-password">New password</label>

                    <div class="password-input">
                        <input type="password" id="new-password" name="new_password" autocomplete="new-password"
                            placeholder="Enter your new password" required>

                        <button type="button" class="show-password" data-target="new-password"
                            aria-label="Show new password">
                            Show
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirm-password">Confirm new password</label>

                    <div class="password-input">
                        <input type="password" id="confirm-password" name="confirm_password" autocomplete="new-password"
                            placeholder="Confirm your new password" required>

                        <button type="button" class="show-password" data-target="confirm-password"
                            aria-label="Show confirmation password">
                            Show
                        </button>
                    </div>
                </div>

                <button type="submit" class="reset-button" id="reset-submit">
                    Reset Password →
                </button>

            </form>

            <div class="signin-link">
                <span>Remember your password?</span>
                <a href="/signin">Sign in</a>
            </div>

        </div>
    </section>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>

    <script>
        const resetForm = document.querySelector("#reset-password-form");
        const newPasswordInput = document.querySelector("#new-password");
        const confirmPasswordInput = document.querySelector("#confirm-password");
        const messageBox = document.querySelector("#form-message");
        const submitButton = document.querySelector("#reset-submit");

        const params = new URLSearchParams(window.location.search);
        const resetToken = params.get("token");

        function showMessage(message, type) {
            messageBox.textContent = message;
            messageBox.className = type;
        }

        // Reveal or hide each password independently.
        document.querySelectorAll(".show-password").forEach(button => {
            button.addEventListener("click", () => {
                const input = document.getElementById(button.dataset.target);
                const isHidden = input.type === "password";

                input.type = isHidden ? "text" : "password";
                button.textContent = isHidden ? "Hide" : "Show";

                button.setAttribute(
                    "aria-label",
                    `${isHidden ? "Hide" : "Show"} ${input.id.replace("-", " ")}`
                );
            });
        });

        // Submit the new password to the existing Flask API.
        resetForm.addEventListener("submit", async event => {
            event.preventDefault();

            messageBox.className = "";

            if (!resetToken) {
                showMessage(
                    "This reset link is missing its token. Please request a new password reset.",
                    "error"
                );
                return;
            }

            if (newPasswordInput.value !== confirmPasswordInput.value) {
                showMessage("The passwords do not match.", "error");
                confirmPasswordInput.focus();
                return;
            }

            submitButton.disabled = true;
            submitButton.textContent = "Resetting password…";

            try {
                const response = await fetch("/api/auth/reset-password", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "same-origin",
                    body: JSON.stringify({
                        token: resetToken,
                        new_password: newPasswordInput.value,
                        confirm_password: confirmPasswordInput.value
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    showMessage(
                        result.error || "Unable to reset your password.",
                        "error"
                    );
                    return;
                }

                showMessage(
                    result.message || "Your password has been reset successfully.",
                    "success"
                );

                resetForm.reset();

                // Remove the token from the address bar after successful use.
                window.history.replaceState(
                    {},
                    document.title,
                    window.location.pathname
                );

                // Redirect to login after a short delay.
                setTimeout(() => {
                    window.location.href = "/drive";
                }, 2000);

            } catch (error) {
                console.error("Password reset request failed:", error);

                showMessage(
                    "Unable to contact the server. Please try again.",
                    "error"
                );
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = "Reset Password →";
            }
        });
    </script>

</body>

</html>
