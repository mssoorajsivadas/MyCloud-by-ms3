<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='assets/images/logo/mycloud-logo.svg') }}">
    <title>Verify Email - MyCloud</title>


    <style>
        :root {
            color-scheme: light;

            --color-bg-main: #f5f7fb;
            --color-bg-card: #ffffff;
            --color-text-primary: #1f2937;
            --color-text-secondary: #6b7280;
            --color-border: #e5e7eb;
            --color-accent: #6366f1;
            --color-accent-hover: #4f46e5;
            --color-success: #059669;
            --color-error: #dc2626;
            --color-input-bg: #ffffff;
            --color-icon-bg: #eef2ff;
        }

        [data-theme="dark"] {
            color-scheme: dark;

            --color-bg-main: #1b1b1b;
            --color-bg-card: #242424;
            --color-text-primary: #f3f4f6;
            --color-text-secondary: #9ca3af;
            --color-border: #343434;
            --color-accent: #818cf8;
            --color-accent-hover: #6366f1;
            --color-success: #34d399;
            --color-error: #f87171;
            --color-input-bg: #101622;
            --color-icon-bg: #252747;
        }

        @font-face {
            font-family: "Material Symbols Rounded";
            src: url("{{ url_for('static', filename='fonts/material-symbols-rounded.woff2') }}") format("woff2");
            font-weight: 100 700;
            font-style: normal;
            font-display: block;
        }

        .material-symbols-rounded {
            font-family: "Material Symbols Rounded";
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: "liga";
            -webkit-font-smoothing: antialiased;
            font-feature-settings: "liga";
        }

        @font-face {
            font-family: "Roboto";
            src: url("{{ url_for('static', filename='fonts/Roboto-VariableFont_wdth,wght.ttf') }}") format("truetype");
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            background: var(--color-bg-main);
            color: var(--color-text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow-x: hidden;
            transition: background-color 0.25s, color 0.25s;
        }

        .page-container {
            width: 100%;
            max-width: 440px;
            margin: auto;
        }

        /* Header */

        .page-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-holder {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .drive-name {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 5px;
            margin-bottom: 8px;
            user-select: none;
        }

        .drive-name h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: -1px;
            color: var(--color-text-primary);
        }

        .drive-name p {
            font-size: 12px;
            color: var(--color-text-secondary);
        }

        .page-subtitle {
            font-size: 14px;
            line-height: 1.6;
            color: var(--color-text-secondary);
        }

        /* Theme button */

        .theme-toggle {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 16px;
            padding: 8px 12px;
            border: 1px solid var(--color-border);
            border-radius: 10px;
            background: var(--color-bg-card);
            color: var(--color-text-primary);
            font-size: 12px;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .theme-toggle:hover {
            border-color: var(--color-accent);
        }

        .material-symbols-rounded {
            font-family: 'Material Symbols Rounded';
            font-weight: normal;
            font-style: normal;
            font-size: 22px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            direction: ltr;
            -webkit-font-smoothing: antialiased;
            font-feature-settings: 'liga';
        }

        /* Verification card */

        .verification-card {
            width: 100%;
            padding: 36px 30px;
            background: var(--color-bg-card);
            border: 1px solid var(--color-border);
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.06);
            transition: background-color 0.25s, border-color 0.25s;
        }

        [data-theme="dark"] .verification-card {
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.2);
        }

        .verification-icon {
            width: 76px;
            height: 76px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            border-radius: 50%;
            background: var(--color-icon-bg);
            color: var(--color-accent);
            transition: background-color 0.25s, color 0.25s;
        }

        .verification-icon .material-symbols-rounded {
            font-size: 38px;
        }

        .verification-icon.success {
            color: var(--color-success);
        }

        .verification-icon.error {
            color: var(--color-error);
        }

        .verification-title {
            font-family: 'Outfit', sans-serif;
            font-size: 23px;
            font-weight: 600;
            line-height: 1.35;
            color: var(--color-text-primary);
            margin-bottom: 12px;
        }

        .verification-message {
            color: var(--color-text-secondary);
            font-size: 14px;
            line-height: 1.7;
            overflow-wrap: anywhere;
            margin-bottom: 26px;
        }

        /* Main button */

        .verification-button {
            width: 100%;
            min-height: 48px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            padding: 13px 18px;
            border: none;
            border-radius: 11px;
            background: var(--color-accent);
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s, opacity 0.2s;
        }

        .verification-button:hover:not(:disabled) {
            background: var(--color-accent-hover);
            transform: translateY(-1px);
        }

        .verification-button:disabled {
            cursor: not-allowed;
            opacity: 0.65;
        }

        .verification-button .material-symbols-rounded {
            font-size: 20px;
        }

        /* Secondary links */

        .secondary-links {
            margin-top: 22px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .secondary-links a {
            color: var(--color-accent);
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
        }

        .secondary-links a:hover {
            text-decoration: underline;
        }

        /* Footer */

        .page-footer {
            margin-top: 24px;
            text-align: center;
            color: var(--color-text-secondary);
            font-size: 12px;
            line-height: 1.6;
        }

        .page-footer .material-symbols-rounded {
            font-size: 15px;
            vertical-align: middle;
            margin-right: 4px;
        }

        @media (max-width: 480px) {
            body {
                padding: 18px;
            }

            .verification-card {
                padding: 30px 22px;
            }

            .verification-title {
                font-size: 21px;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>

    <main class="page-container">

        <header class="page-header">
            <div class="logo-holder">
                <img style="width: 80px; height: auto;"
                    src="{{ url_for('static', filename='assets/images/logo/mycloud-logo-v1.svg') }}" alt="logo">
                <div class="drive-name" id="brand-home" title="Go to MyCloud">
                    <h1>MyCloud</h1>
                    <p>by ms3</p>
                </div>
            </div>


            <p class="page-subtitle">
                Secure cloud storage for your files.
            </p>

            <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle color theme">

                <span class="material-symbols-rounded" id="theme-icon">
                    dark_mode
                </span>

                <span id="theme-label">Dark mode</span>
            </button>
        </header>

        <section class="verification-card" aria-labelledby="verification-title">

            <div id="verification-icon" class="verification-icon">
                <span class="material-symbols-rounded" id="verification-symbol">
                    mark_email_unread
                </span>
            </div>

            <h2 class="verification-title" id="verification-title">
                Verify your email
            </h2>

            <p class="verification-message" id="verification-message" role="status" aria-live="polite">

                Confirm your email address to finish setting up your account.
            </p>

            <button id="verify-button" class="verification-button" type="button">

                <span class="material-symbols-rounded" id="button-icon">
                    verified
                </span>

                <span id="button-label">Verify Email</span>
            </button>

            <nav class="secondary-links" aria-label="Account navigation">
                <a href="/signin">Back to Sign In</a>
            </nav>

        </section>

        <footer class="page-footer">
            <span class="material-symbols-rounded">lock</span>
            Your account and files deserve to stay secure.
        </footer>

    </main>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>

    <script>
        const verifyButton = document.getElementById("verify-button");
        const message = document.getElementById("verification-message");
        const title = document.getElementById("verification-title");
        const iconContainer = document.getElementById("verification-icon");
        const icon = document.getElementById("verification-symbol");
        const buttonIcon = document.getElementById("button-icon");
        const buttonLabel = document.getElementById("button-label");

        const params = new URLSearchParams(window.location.search);
        const token = params.get("token");

        let verificationStarted = false;

        function showVerificationState(state, heading, text, symbol) {
            title.textContent = heading;
            message.textContent = text;
            icon.textContent = "";
            icon.appendChild(createIcon(symbol));

            iconContainer.classList.remove("success", "error");

            if (state === "success") {
                iconContainer.classList.add("success");
            } else if (state === "error") {
                iconContainer.classList.add("error");
            }
        }

        function createIcon(symbol) {
            const span = document.createElement("span");
            span.className = "material-symbols-rounded";
            span.id = "verification-symbol";
            span.textContent = symbol;
            return span;
        }

        function setButton(iconName, label, disabled) {
            buttonIcon.textContent = iconName;
            buttonLabel.textContent = label;
            verifyButton.disabled = disabled;
        }

        function showMissingToken() {
            showVerificationState(
                "error",
                "Verification link is incomplete",
                "This link does not contain a verification token. Please use the verification link from your email.",
                "link_off"
            );

            setButton("refresh", "Try Again", false);
        }

        if (!token) {
            showMissingToken();
        }

        verifyButton.addEventListener("click", async () => {
            if (!token) {
                showMissingToken();
                return;
            }

            if (verificationStarted) {
                return;
            }

            verificationStarted = true;

            setButton("progress_activity", "Verifying...", true);

            showVerificationState(
                "loading",
                "Verifying your email",
                "Please wait while we confirm your email address.",
                "progress_activity"
            );

            try {
                const response = await fetch("/api/auth/verify-email", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ token })
                });

                const data = await response.json();

                if (!response.ok) {
                    showVerificationState(
                        "error",
                        "Verification unsuccessful",
                        data.error || data.message ||
                        "We couldn't verify your email. The link may have expired or already been used.",
                        "error"
                    );

                    setButton("refresh", "Try Again", false);
                    verificationStarted = false;
                    return;
                }

                showVerificationState(
                    "success",
                    "Email verified successfully!",
                    "Your email address has been confirmed. Taking you to MyCloud...",
                    "mark_email_read"
                );

                setButton("check_circle", "Verified", true);

                setTimeout(() => {
                    window.location.href = "/drive";
                }, 1500);

            } catch (error) {
                console.error("Email verification request failed:", error);

                showVerificationState(
                    "error",
                    "Connection problem",
                    "We couldn't contact the server. Check your connection and try again.",
                    "cloud_off"
                );

                setButton("refresh", "Try Again", false);
                verificationStarted = false;
            }
        });

        document.getElementById("brand-home").addEventListener("click", () => {
            window.location.href = "/";
        });

        // If the verification request failed, allow the user to retry.
        verifyButton.addEventListener("click", () => {
            if (!token) {
                showMissingToken();
            }
        });
    </script>

</body>

</html>
