<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify Email - Cloud Drive</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <style>
        :root {
            --bg-color: #0b0f17;
            --card-bg: rgba(18, 24, 38, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --success: #10b981;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body.auth-page {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            padding: 1.5rem;
        }

        /* Ambient background glow effects */
        .auth-page::before,
        .auth-page::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 0;
            pointer-events: none;
        }

        .auth-page::before {
            width: 350px;
            height: 350px;
            background: rgba(99, 102, 241, 0.15);
            top: 15%;
            left: 20%;
        }

        .auth-page::after {
            width: 300px;
            height: 300px;
            background: rgba(16, 185, 129, 0.1);
            bottom: 15%;
            right: 20%;
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            z-index: 1;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .auth-brand {
            text-align: center;
        }

        .brand-icon {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            display: inline-block;
        }

        .auth-brand h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #ffffff;
        }

        .auth-brand p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }

        .auth-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
            transition: all 0.3s ease;
        }

        .verification-icon {
            width: 64px;
            height: 64px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem auto;
            color: var(--accent);
            transition: all 0.3s ease;
        }

        .verification-icon .material-symbols-rounded{
            font-size: 40px;
        }

        /* Dynamic styling when JS modifies text content */
        .verification-icon:has(span),
        .verification-icon {
            font-weight: bold;
        }

        .auth-header h2 {
            font-family: 'Outfit', sans-serif;
            font-size: 1.35rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: #ffffff;
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: 0.925rem;
            line-height: 1.5;
            margin-bottom: 1.75rem;
        }

        .auth-button {
            display: none;
            /* Controlled by your JS script */
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            padding: 0.85rem 1.25rem;
            background-color: var(--accent);
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 12px;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 14px rgba(99, 102, 241, 0.3);
        }

        .auth-button:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        .auth-button span {
            transition: transform 0.2s ease;
        }

        .auth-button:hover span {
            transform: translateX(4px);
        }

        .auth-bottom {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.825rem;
            opacity: 0.8;
        }

        .drive-name {
            display: flex;
            align-items: end;
            justify-content: center;
            gap: 3px;

            padding: 10px;

            cursor: pointer;

            font-size: 12px;
        }

        .drive-name p {
            color: var(--text-muted);
        }

        #verify-button{
            background: var(--accent);
            border: none;
            padding: 15px 20px;
            border-radius: 50px;
            color: #ffffff;
            cursor: pointer;
        }

        #verify-button:hover{
            background: var(--accent-hover);
        }
           
    </style>
</head>

<body class="auth-page">

    <div class="auth-container">

        <div class="auth-brand">
            <div class="drive-name" onclick="window.location.href='/'">
                <h1>MyCloud</h1>
                <p>by ms3</p>
            </div>
            <p>Secure cloud storage for your files.</p>
        </div>

        <div class="auth-card verification-card">

            <div id="verification-icon" class="verification-icon">
                <span class="material-symbols-rounded">
                    mail
                </span>
            </div>

            <div class="auth-header">
                <h2 id="verification-title">
                    Email Verification
                </h2>

                <p id="verification-message" role="status">
                    Please verify your email address.
                </p>
            </div>

            <button id="verify-button" type="button">
                Verify Email
            </button>
        </div>

        <div class="auth-bottom">
            🔒 Your account is protected.
        </div>

    </div>

    <!-- Your external JS script that contains your logic -->
    <script>
        const verifyButton = document.getElementById("verify-button");
        const message = document.getElementById("verification-message");

        const params = new URLSearchParams(window.location.search);
        const token = params.get("token");

        verifyButton.addEventListener("click", async () => {
            if (!token) {
                message.textContent = "Verification token is missing.";
                return;
            }

            verifyButton.disabled = true;
            verifyButton.textContent = "Verifying...";
            message.textContent = "";

            try {
                const response = await fetch("/api/auth/verify-email", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ token })
                });

                const data = await response.json();

                if (!response.ok) {
                    message.textContent =
                        data.error || "Email verification failed.";

                    verifyButton.disabled = false;
                    verifyButton.textContent = "Verify Email";
                    return;
                }

                message.textContent =
                    "Email verified successfully! Redirecting...";

                setTimeout(() => {
                    window.location.href = "/drive";
                }, 1500);

            } catch (error) {
                message.textContent =
                    "Unable to verify your email. Please try again.";

                verifyButton.disabled = false;
                verifyButton.textContent = "Verify Email";
            }
        });

    </script>

</body>

</html>
