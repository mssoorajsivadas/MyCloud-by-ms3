<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='assets/images/logo/mycloud-logo.svg') }}">
    <title>Login page</title>

    <style>
        /* Light theme — default */
        :root {
            color-scheme: light;

            --bg-gradient: linear-gradient(135deg, #C0D4F8 0%, #E3EFFF 45%, #E8D8EE 100%);

            /* Light Theme */
            --color-primary: #567fff;
            --color-primary-hover: #3D7BD4;

            --color-bg-main: #f2f2ea;
            --color-bg-surface: #FFFFFF;
            --color-bg-overlay: #e8e8de;

            --color-text-primary: #131418;
            --color-text-secondary: #2e3138;
            --color-text-muted: #474b54;

            --color-border: #e7ebef;
            --color-hover-state: #dbded7;
            --color-active: #567fff;
            --color-focus-ring: #5597EB;

            /* Light theme message colors */
            --message-success-bg: #DCFCE7;
            --message-success-text: #166534;

            --message-error-bg: #FEE2E2;
            --message-error-text: #991B1B;

            --message-warning-bg: #FEF3C7;
            --message-warning-text: #92400E;

            --message-info-bg: #DBEAFE;
            --message-info-text: #1E40AF;
        }

        /* Dark theme */
        [data-theme="dark"] {
            color-scheme: dark;

            --bg-gradient: linear-gradient(135deg, #6B8FD4 0%, #8BA8D9 45%, #A88BB8 100%);

            --color-primary: #2867ac;
            --color-primary-hover: #3D7BD4;

            --color-bg-main: #1b1b1b;
            --color-bg-surface: #242424;
            --color-bg-overlay: #36373b;

            --color-text-primary: #F1F5F9;
            --color-text-secondary: #CBD5E1;
            --color-text-muted: #64748B;

            --color-border: #343434;
            --color-hover-state: #353535;
            --color-active: #2867ac;
            --color-focus-ring: #5597EB;

            /* Dark theme message colors */
            --message-success-bg: #14532D;
            --message-success-text: #BBF7D0;

            --message-error-bg: #7F1D1D;
            --message-error-text: #FECACA;

            --message-warning-bg: #78350F;
            --message-warning-text: #FDE68A;

            --message-info-bg: #1E3A8A;
            --message-info-text: #BFDBFE;
        }

        @font-face {
            font-family: "Material Symbols Rounded";
            src: url("{{ url_for('static', filename='fonts/material-symbols-rounded.woff2') }}") format("woff2");
            font-weight: 100 700;
            font-style: normal;
            font-display: block;
        }

        .material-symbols-rounded {
            font-family: "Material Symbols Rounded";
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: "liga";
            -webkit-font-smoothing: antialiased;
            font-feature-settings: "liga";
        }

        @font-face {
            font-family: "Roboto";
            src: url("{{ url_for('static', filename='fonts/Roboto-VariableFont_wdth,wght.ttf') }}") format("truetype");
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            background: var(--color-bg-main);
            font-family: Arial, Helvetica, sans-serif;
            overflow: hidden;
            color: var(--color-text-primary);
        }

        .signup-section {
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .signup-card {
            width: min(100%, 500px);
            padding: 35px;
            background: var(--color-bg-surface);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.12);
        }

        .glossy-typewriter-wrap {
            padding: 50px 0px;
        }

        .glossy-typewriter {
            font-size: 40px;
            cursor: pointer;
        }

        .signup-header {
            margin-bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .signup-header h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .signup-header p {
            margin: 0;
            color: var(--color-text-secondary);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 7px;
            margin-bottom: 18px;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;

            border-radius: 10px;
            border: none;

            background: var(--color-bg-main);
            color: var(--color-text-secondary);

            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border: 1px solid var(--color-border);
        }

        .name-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .signin-button {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 10px;

            background: var(--color-active);
            color: var(--color-text-primary);

            font-size: 15px;
            cursor: pointer;
        }

        .signin-button:hover {
            opacity: 0.9;
        }

        .signin-link {
            margin-top: 22px;
            text-align: center;
            font-size: 14px;
        }

        .signin-link a {
            margin-left: 5px;
            color: var(--color-active);
            font-weight: 600;
            text-decoration: none;
        }

        #form-message {
            display: none;

            padding: 10px 14px;
            margin-bottom: 15px;

            border-radius: 8px;

            font-size: 14px;

            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        #form-message.success {
            display: flex;
            background: var(--message-success-bg);
            color: var(--message-success-text);
        }

        #form-message.error {
            display: flex;
            background: var(--message-error-bg);
            color: var(--message-error-text);
        }

        #form-message.warning {
            display: flex;
            background: var(--message-warning-bg);
            color: var(--message-warning-text);
        }

        #form-message.info {
            display: flex;
            background: var(--message-info-bg);
            color: var(--message-info-text);
        }

        #message-close {

            border: none;

            background: transparent;

            font-size: 20px;

            cursor: pointer;

            color: inherit;
        }

        .password-input {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-input input {
            padding-right: 60px;
        }

        .show-password {
            position: absolute;
            right: 10px;

            border: none;
            background: transparent;

            color: var(--color-text-secondary);
            font-size: 13px;
            cursor: pointer;
        }

        .theme {
            position: absolute;

            display: flex;
            align-items: center;
            gap: 10px;

            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: var(--color-bg-surface);
            color: var(--color-text-secondary);
            border-radius: 50px;
            border: none;
        }

        .theme .material-symbols-rounded {
            font-size: 19px;
        }

        .theme:hover {
            background: var(--color-hover-state);
        }

        .logo-holder {
            position: absolute;
            top: 10px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .drive-name {
            display: flex;
            align-items: end;
            gap: 3px;

            position: relative;
            top: -10px;
            user-select: none;
            font-size: 12px;
        }

        .drive-name h1,
        .drive-name p {
            margin-bottom: 0;
        }

        .drive-name p {
            color: var(--color-text-secondary);
        }

        .forgot-password-link {
            display: flex;
            justify-content: flex-end;
            margin-top: 8px;
            margin-bottom: 18px;
        }

        .forgot-password-link a {
            color: var(--color-accent);
            font-size: 13px;
            text-decoration: none;
        }

        .forgot-password-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="logo-holder">
        <img style="width: 80px; height: auto;"
            src="{{ url_for('static', filename='assets/images/logo/mycloud-logo-v1.svg') }}" alt="logo">
        <div class="drive-name" id="brand-home" title="Go to MyCloud">
            <h1>MyCloud</h1>
            <p>by ms3</p>
        </div>
    </div>

    <button class="theme" id="theme-toggle" type="button" aria-label="Switch to dark theme">
        <span id="theme-icon" class="material-symbols-rounded"> dark_mode </span>
        <span class="label" id="theme-label">Dark mode</span>
    </button>

    <section class="signup-section">
        <div class="signup-card">

            <div class="signup-header">
                <h1>Welcome back</h1>
                <p>Sign-in to continue to your drive account. </p>
            </div>

            <form id="signin-form">

                <div class="form-group">
                    <label for="username">Username / Email</label>

                    <input type="text" id="username" name="login" autocomplete="username" autocomplete="off"
                        placeholder="Choose a username or email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>

                    <div class="password-input">

                        <input type="password" id="password" name="password" autocomplete="new-password"
                            placeholder="Enter your password" minlength="8" required>


                        <button type="button" class="show-password" id="show-password">
                            Show
                        </button>

                    </div>
                    <div class="forgot-password-link">
                        <a href="/forgot-password">Forgot password?</a>
                    </div>
                </div>

                <div id="form-message">
                    <span id="message-text"></span>
                    <button id="message-close" type="button">×</button>
                </div>

                <button type="submit" class="signin-button">
                    Sign in →
                </button>

            </form>

            <div class="signin-link">
                <span>Don't have an account?</span>
                <a href="/signup">Create account </a>
            </div>

        </div>
    </section>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script>

        // show message
        const username = document.querySelector("#username");
        const password = document.querySelector("#password");
        const messageBox = document.querySelector("#form-message");
        const messageText = document.querySelector("#message-text");
        const closeButton = document.querySelector("#message-close");
        const showPassword = document.querySelector("#show-password");

        window.addEventListener("pageshow", () => {
            form.reset();
        });

        function showMessage(message, type) {

            messageText.textContent = message;

            messageBox.className = type;

            setTimeout(() => {
                messageBox.className = "";
            }, 5000);

        }

        // read message
        function readPendingMessage() {
            const storedMessage = sessionStorage.getItem("pendingFlashMessage");

            if (!storedMessage) {
                return;
            }

            sessionStorage.removeItem("pendingFlashMessage");

            try {
                const data = JSON.parse(storedMessage);

                if (data.message && ["success", "error", "warning", "info"].includes(data.type)) {
                    showMessage(data.message, data.type);
                }
            } catch (error) {
                console.error("Failed to read stored message:", error);
            }
        }

        readPendingMessage();

        // message close button
        closeButton.addEventListener("click", () => {

            messageBox.className = "";

        });

        // show password
        showPassword.addEventListener("click", () => {

            if (password.type === "password") {

                password.type = "text";
                showPassword.textContent = "Hide";

            } else {

                password.type = "password";
                showPassword.textContent = "Show";

            }

        });

    </script>
</body>

</html>
